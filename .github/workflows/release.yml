name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PNPM_VERSION: "10.34.5"

jobs:
  release:
    name: npm 배포
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스 노트 생성
      id-token: write # npm Trusted Publishing / provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # 릴리스 노트를 만들려면 이전 태그까지의 이력이 필요합니다.
          # 얕은 체크아웃(fetch-depth: 1)이면 직전 태그를 못 찾습니다.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          # 릴리스 잡만 최신 Node 를 씁니다 — npm Trusted Publishing(OIDC)이
          # npm >= 11.5.1 · Node >= 22.14 를 요구하는데, Node 20.19 에 동봉된
          # npm 은 10.8.2 라 전환이 막힙니다. 배포 산출물은 tsup 이
          # `target: node20` 으로 내보내므로 이 값에 영향받지 않고, Node 20
          # 동작은 CI 매트릭스가 계속 검증합니다.
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # 게이트가 **버전 주입보다 먼저**입니다. 순서를 바꾸지 마세요.
      #
      # `tests/packaging.test.ts` 는 저장소의 `version` 이 `0.0.0` 플레이스홀더인지
      # 검사합니다 — 소스에 버전을 박아 태그와 어긋나는 것을 막는 장치입니다.
      # 주입을 먼저 하면 그 테스트가 주입된 버전을 보고 실패해, 릴리스가 배포
      # 직전에 멈춥니다. 게이트는 커밋된 트리를 검사하는 것이지 배포 산출물을
      # 검사하는 것이 아니고, 주입이 바꾸는 것은 버전 문자열 하나뿐입니다.
      - name: 전 게이트 재실행
        run: |
          pnpm exec biome ci .
          pnpm typecheck
          pnpm test

      # 버전의 유일한 출처는 git 태그입니다. package.json 의 version 은 0.0.0
      # 플레이스홀더이고 손대지 않습니다 — 여기서 태그 값을 주입합니다.
      - name: 태그에서 버전 주입
        run: |
          TAG="${GITHUB_REF_NAME}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - run: pnpm build

      - name: npm publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 릴리스 노트
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
