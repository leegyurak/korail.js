name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PNPM_VERSION: "10.34.5"

jobs:
  release:
    name: npm 배포
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스 노트 생성
      id-token: write # npm Trusted Publishing / provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # 릴리스 노트를 만들려면 이전 태그까지의 이력이 필요합니다.
          # 얕은 체크아웃(fetch-depth: 1)이면 직전 태그를 못 찾습니다.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # 버전의 유일한 출처는 git 태그입니다. package.json 의 version 은 0.0.0
      # 플레이스홀더이고 손대지 않습니다 — 여기서 태그 값을 주입합니다.
      - name: 태그에서 버전 주입
        run: |
          TAG="${GITHUB_REF_NAME}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: 전 게이트 재실행
        run: |
          pnpm exec biome ci .
          pnpm typecheck
          pnpm test

      - run: pnpm build

      - name: npm publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 릴리스 노트
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
