# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit 리뷰 설정. 이 파일은 **저장소 루트**에 있어야 하고, PR 브랜치의
# 버전이 그 PR 리뷰에 쓰입니다 — 이 파일을 고치는 PR 은 바뀐 설정으로 리뷰됩니다.
#
# 리뷰는 **게이트가 아닙니다.** 필수 상태 체크는 `ci-ok` 하나뿐이고
# (`.github/rulesets/main-protection.json`), 아래 request_changes_workflow 와
# pre_merge_checks 를 머지를 막지 않는 쪽으로 둔 것도 그래서입니다.

language: ko-KR

tone_instructions: >-
  간결하고 근거 중심으로. 실행해 확인한 것과 코드를 읽고 추론한 것을 구분해 적고,
  못 돌려본 것은 그렇게 밝히세요. 확신이 낮아도 빼지 말고 확신도를 함께 적으세요.

reviews:
  # 이 저장소는 "조용히 빠뜨리는 것보다 올렸다가 기각되는 편이 낫다" 는 쪽입니다.
  # 걸러내는 것은 사람이 합니다.
  profile: assertive

  # 리뷰가 변경 요청을 걸면 머지가 잠깁니다. 리뷰는 보조 도구지 게이트가 아닙니다.
  request_changes_workflow: false

  high_level_summary: true
  collapse_walkthrough: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    # 기계가 만든 잠금 파일. 의존성 변화는 package.json 으로 봅니다.
    - "!pnpm-lock.yaml"
    # 빌드 산출물.
    - "!dist/**"
    - "!coverage/**"
    # 로컬 실험 스크립트 (.gitignore 대상이지만 방어적으로 한 번 더).
    - "!scratch*.ts"
    - "!local/**"

  path_instructions:
    - path: "src/{constants.ts,crypto.ts}"
      instructions: >-
        여기는 이 저장소에서 가장 위험한 영역입니다. 실수가 에러가 아니라 **조용한
        로그인 차단**으로 나타나고, 테스트는 통과합니다.

        `USER_AGENT`·`APP_VERSION`·`API_KEY`·`SID_KEY`·`DEVICE_ID` 가 근거 없이
        바뀌었다면 최우선으로 지적하세요. 서버가 앱 버전·기기 문자열·TLS 지문·
        서명을 교차 검증하므로 하나만 어긋나도 그 자체가 탐지 신호입니다.

        암호화 형태를 "고치려" 든 흔적도 마찬가지입니다 — 이중 base64, `Sid` 끝의
        개행, 키를 IV 로 재사용하는 AES-CBC 는 전부 서버가 그 모양을 기대해서
        그렇게 둔 것입니다. 정상화하려는 변경은 회귀입니다.

        `node:crypto` 를 쓸 때 서버가 준 키 길이에 따라 `aes-128/192/256-cbc` 를
        고르는지 확인하세요. 길이를 고정하면 특정 키에서만 실패합니다.

        이 영역을 건드린 PR 에 **요청 페이로드 불변을 증명하는 테스트**가 함께
        오지 않았다면 그 사실을 지적하세요.

    - path: "src/auth/**"
      instructions: >-
        DynaPath 서명 코드입니다. `dynapath.ts` 의 인코딩 테이블과 상수
        (`TABLE`·`RADIX`·`MODULUS`·`CHUNK`)가 바뀌었다면 최우선 지적입니다 —
        서버가 로그인을 거부하게 됩니다.

        **`BigInt` 가 `Number` 로 바뀌지 않았는지 반드시 보세요.** 키 유도
        누산값과 테이블 생성의 나눗셈은 무제한 정수라 `Number` 로는 큰 입력에서만
        조용히 틀립니다 — 작은 테스트 입력으로는 안 잡힙니다.

        User-Agent 와 서명(`os=`·`dm=`)은 **같은 기기를 가리켜야** 합니다.
        `deviceProfile` 이 둘을 함께 바꾸는데, 한쪽만 바뀌는 변경은 불일치 자체가
        탐지 신호가 됩니다.

        `tests/dynapath.test.ts` 의 골든 테스트가 함께 통과하는지 확인하세요.

    - path: "src/transport.ts"
      instructions: >-
        TLS 지문을 맞추는 곳이고, **이 저장소에서 유일하게 실서버 검증이 끝나지
        않은 영역**입니다.

        JA3 문자열이나 ClientIdentifier 가 바뀌었다면, PR 본문에 **실측 근거**가
        있는지 확인하세요. 없으면 지적하세요 — 추측으로 바꾼 값은 되돌려야 합니다.

        전송 라이브러리를 교체하는 변경이라면 쿠키 스토어가 유지되는지 확인하세요.
        로그인 세션 쿠키가 후속 조회 요청에 실리지 않으면 P058 이 나고, 그건
        "로그인이 안 된다" 로 오인됩니다.

    - path: "src/resources/**"
      instructions: >-
        엔드포인트는 **여기에만** 있습니다. `Korail` 본체(`client.ts`)에 API
        메서드가 붙었다면 계층 위반입니다.

        HTTP 는 `ApiClient` 를 통해서만 나갑니다 — 리소스가 `#session` 을 직접
        만지거나 전송 라이브러리를 import 하면 위반입니다.

        상태를 바꾸는 메서드(`pay`·`cancel`·`refund`)는 `Promise<void>` 를 반환하고
        실패 시 throw 해야 합니다. 성공 여부를 불리언으로 돌려주면 위반입니다.

        폼 필드를 "안 쓰는 것 같아서" 지운 흔적을 찾으세요. 빈 문자열로 보내는
        필드(`txtChgFlg2` 등)나 조회 엔드포인트만 `Key` 없이 빈 `Sid` 를 보내는
        것은 공식 앱 동작을 그대로 옮긴 것입니다 — 정리하면 회귀입니다.

        **폼 키를 camelCase 로 "정리"한 흔적을 특히 보세요.** `txtGoAbrdDt` 는
        서버가 정한 철자입니다. JS 네이밍 관용은 우리가 만든 이름에만 적용합니다.

        **폼 값에 `undefined` 가 들어갈 수 있는지** 보세요 — 그 필드는 요청에서
        조용히 사라지고, `null` 은 문자열 `"null"` 로 나갑니다.

        **새 엔드포인트라면** PR 본문에 공식 코레일톡+ APK 디컴파일 근거(경로·폼
        필드 철자·서명 대상 여부)가 있는지 확인하고, 없으면 지적하세요. 추측한
        필드 이름은 에러가 아니라 조용한 빈 값이 됩니다.

    - path: "src/models/**"
      instructions: >-
        응답 모델은 전부 `readonly` 필드이고 생성자 끝에서 `Object.freeze(this)`
        를 부르며 `static fromResponse()` 로만 만듭니다. 생성자는 값 조립, 응답
        해석은 `fromResponse` — 이 경계를 섞으면 지적하세요.

        **`Object.freeze` 는 얕습니다.** 배열·객체 필드를 복사해서 함께 동결하지
        않았다면 지적하세요 — 호출자가 넘긴 배열을 그대로 보관하면 나중에 밖에서
        `push` 한 것이 모델에 반영됩니다.

        객체를 만든 뒤 필드를 채우는 코드는 금지입니다. 부속 데이터가 필요하면
        먼저 조회해 생성자에 넘겨야 합니다.

        상속이 아니라 합성입니다. `Ticket`·`Reservation` 은 `Train` 을 **참조**
        합니다 — "A는 B다" 가 참일 때만 상속하세요.

        응답 파싱은 `models/parsing.ts` 의 `text`/`integer`/`floating` 으로.
        응답 객체를 날로 인덱싱했다면 지적하세요 — `Number("")` 은 `0`,
        `Number(null)` 도 `0` 이라 잘못된 값이 예외가 아니라 그럴듯한 숫자가 되어
        그대로 흘러갑니다.

        `new Date("20260401")` 처럼 코레일 날짜 문자열을 `Date` 생성자에 넘긴 곳이
        있으면 지적하세요 — 파싱이 구현 의존이라 환경마다 다르게 깨집니다.

        민감한 값을 담는 모델은 **`toJSON` 과 `util.inspect.custom` 을 둘 다**
        막았는지 보세요 (`Card` 참고). 하나만 막으면 다른 쪽으로 샙니다.

    - path: "src/errors/**"
      instructions: >-
        새 `KorailApiError` 하위 클래스가 `CODED_ERRORS` 배열에 등록됐는지
        확인하세요. JS 에는 서브클래스 자동 탐색이 없어 배열이 유일한 등록
        지점이고, 빠지면 사용자가 구체 타입 대신 밋밋한 `KorailApiError` 를
        받습니다 — 에러도 안 나고 테스트도 통과합니다.

        `codes` 는 `static override readonly` 여야 하고 `Set<string>` 입니다.
        생성자를 덮어썼다면 지적하세요 — 시그니처가 계층 전체에서 같아야
        `errorForCode()` 가 균일하게 조립합니다.

        `name` 을 설정했는지 보세요. 없으면 스택트레이스에 부모 클래스 이름이
        찍혀 원인 파악이 어려워집니다.

        클라이언트 측 입력 오류를 `KorailApiError` 아래에 넣었다면 지적하세요 —
        서버 응답이 아닌 것이 섞이면 `instanceof KorailApiError` 의 의미가
        흐려집니다. `KorailError` 의 형제여야 합니다.

    - path: "src/**/*.ts"
      instructions: >-
        서버 응답은 `any` 가 아니라 **`unknown`** 으로 받고 파싱 헬퍼로 좁힙니다.
        `JSON.parse` 가 `any` 를 돌려주므로 여기서 막지 않으면 타입 안전성이
        코드베이스 전체로 샙니다.

        **`enum` 을 쓰면 지적하세요.** 이 저장소는 `as const` 객체 + 유니온 타입을
        씁니다 — `enum` 은 런타임 객체를 만들어 트리셰이킹을 막고 숫자 enum 은
        역매핑 키까지 만듭니다.

        타입만 쓰는 import 는 `import type` 이어야 합니다 (`verbatimModuleSyntax`).

        내부 상태는 TS 의 `private` 이 아니라 **`#private`** 여야 합니다.
        `private` 은 컴파일 후 사라져 JS 사용자에게 그대로 노출됩니다.

        공개 API 에 반환 타입이 명시됐는지 보세요. 추론에 맡기면 내부 구현이 바뀔
        때 공개 타입이 조용히 따라 바뀝니다.

        `@ts-ignore` 를 썼다면 지적하고 `@ts-expect-error` 를 권하세요 — 오류가
        없어지면 그 자체가 실패하므로 안전합니다. 어느 쪽이든 같은 줄에 **왜**
        인지 적혀 있어야 합니다.

        `!` (non-null assertion) 로 `noUncheckedIndexedAccess` 를 덮은 곳이
        있으면 지적하세요. 그 규칙은 실제 버그를 잡습니다.

        생성자에서 I/O 를 하지 않습니다. 공개 표면은 전부 `async` 입니다.

        주석은 "무엇"이 아니라 **"왜"**. 이상해 보이는 코드(앱 동작 재현, 서버
        요구사항)에 이유가 없으면 지적하세요 — 다음 사람이 "정리" 하려 듭니다.

    - path: "tests/**/*.ts"
      instructions: >-
        **테스트 함수 안에 `if`/`for`/`while` 문을 쓰지 않습니다.** 여러 케이스는
        `it.each`, 반복 검증은 `filter`/`map` 으로 위반 목록을 만들어 빈 배열과
        비교합니다. `tests/style.test.ts` 가 AST 로 강제하지만, 우회한 흔적이
        있는지 보세요.

        `// when` 과 `// then` 은 필수, `// given` 은 준비 코드가 있을 때만.
        when 블록이 여러 줄이면 대개 테스트 하나가 두 가지를 검증하는 신호입니다.

        **`await` 이 빠진 비동기 단언을 최우선으로 찾으세요.**
        `expect(p).rejects.toThrow(...)` 는 `await` 없이도 **통과합니다** — 이
        저장소에서 가장 흔하고 가장 조용한 사고입니다.

        **네트워크 금지.** `helpers.ts` 의 `FakeSession` 과 `korail`/`makeKorail`
        픽스처를 씁니다. 실제 요청을 보내는 테스트가 있으면 반드시 지적하세요.

        응답 샘플은 `tests/payloads.ts` 에 모읍니다. 필드 이름은 실제 응답에서 온
        것이니 지어내면 안 됩니다.

        **단언이 실제로 일하는지** 보세요. 좌우가 같은 식이면 항진식이라 항상
        통과합니다. `toBe`/`toEqual` 을 `toBeTruthy` 로 느슨하게 바꾼 흔적도
        보세요 — 커버리지는 오르고 검증은 사라집니다.

        경계 동작이 덮였는지: 필드 누락, 빈 문자열, 자정을 넘기는 시각, 매진,
        예약대기, 로그인 실패, ESM/CJS 양쪽 진입점. 이 코드베이스의 버그는 대부분
        거기서 나왔습니다.

        자격증명·카드번호·실제 예약번호가 섞여 들어갔다면 최우선 지적입니다.

    - path: "{package.json,tsup.config.ts,tsconfig.json}"
      instructions: >-
        **`version` 이 `0.0.0` 이 아니면 지적하세요.** 버전의 유일한 출처는 git
        태그이고, 릴리스 워크플로가 주입합니다. 여기에 숫자를 적으면 태그와
        어긋납니다.

        `exports` 맵이 `types`·`import`·`require` 를 모두 가리키는지, `types` 가
        가장 먼저 오는지 확인하세요. 순서가 틀리면 일부 번들러에서 타입이 안
        잡힙니다.

        `files` 가 `dist/` 로 좁혀져 있는지 보세요 — 넓히면 `.env` 나 테스트
        픽스처가 npm 에 실릴 수 있습니다.

        `engines.node` 하한을 바꿨다면 `tsconfig` 의 `target`/`lib` 와 두 워크플로
        매트릭스가 함께 맞는지 확인하세요.

        `postinstall` 스크립트가 추가됐다면 지적하세요 — 이 패키지는 설치 시
        임의 코드를 실행하지 않는다고 `SECURITY.md` 에 적혀 있습니다.

    - path: ".github/workflows/**"
      instructions: >-
        릴리스 워크플로가 태그에서 버전을 뽑아 `package.json` 에 주입하는지
        확인하세요. 그 단계가 빠지면 `0.0.0` 이 npm 에 올라갑니다.

        빌드 잡이 **ESM `import` 과 CJS `require` 를 둘 다** 확인하는지 보세요.
        TS 로만 개발하면 JS 사용자 경로가 깨져도 눈에 띄지 않습니다.

        지원 Node 버전을 바꿨다면 `package.json` 의 `engines`, `tsconfig` 의
        `target`/`lib`, 두 워크플로의 매트릭스가 함께 맞는지 확인하세요.

        필수 상태 체크는 `ci-ok` 하나입니다. 새 잡을 `ci-ok` 의 `needs` 에 넣으면
        그 잡이 머지를 막게 됩니다 — 의도한 것인지 확인하세요.

        커버리지 게이트를 CI 에서만 우회하는 변경은 지적하세요.

    - path: "**/*.md"
      instructions: >-
        공개 API 를 바꿨다면 `docs/reference.md` 가 함께 갱신됐는지 보세요.

        **JS 예제와 TS 예제가 함께 있는지** 보세요. 이 패키지는 둘 다 지원하는데
        문서가 TS 만 보여 주면 CJS 사용자가 막힙니다.

        **확인하지 않은 것을 확정 서술로 적었는지** 보세요. 이 저장소는 추측을
        사실처럼 쓰지 않는 것을 규범으로 삼습니다(`AGENTS.md` §3). 특히 TLS 지문은
        아직 실서버로 검증되지 않았으므로, "통과한다" 고 단정한 문장이 있으면
        지적하세요.

        TSDoc 과 산문은 한국어, 코드 식별자는 영어입니다.

  tools:
    # Biome 이 이 저장소의 유일한 린터·포매터입니다. 다른 JS 린터는 같은 것을
    # 다른 규칙으로 다시 지적해 소음만 만듭니다.
    eslint:
      enabled: false
    oxlint:
      enabled: false
    prettier:
      enabled: false
    # 산문 검사기. 문서·주석이 전부 한국어라 유효한 지적을 기대하기 어렵습니다.
    languagetool:
      enabled: false
    # README 가 HTML 을 섞어 쓰고 줄 길이 규약도 따로라 오탐이 많습니다.
    markdownlint:
      enabled: false

    biome:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    # 이 저장소는 자격증명이 섞여 들어가면 안 되는 곳입니다. 둘 다 켜 둡니다.
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true

  finishing_touches:
    # 테스트에는 AST 로 강제되는 규약(제어 흐름 금지·GWT 주석)이 있어서, 자동
    # 생성된 테스트는 tests/style.test.ts 에서 그대로 실패합니다.
    unit_tests:
      enabled: false
    # TSDoc 은 한국어로 쓰고 공개 API 에만 답니다. 자동 생성은 규약과 어긋납니다.
    docstrings:
      enabled: false

  pre_merge_checks:
    # 전부 warning 입니다 — 리뷰가 머지를 막지 않게 하려는 것입니다.
    title:
      mode: warning
      requirements: >-
        제목은 `<PREFIX>: <요약>` 형식이어야 합니다. 접두사는 ADD · FIX · REF ·
        DEL · DOCS · UPT 중 하나이고, 요약은 한국어 명사형 종결로 마침표 없이
        씁니다. 자세한 기준은 `.claude/skills/commit/SKILL.md` 에 있습니다.
    description:
      mode: warning
    # 독스트링 커버리지 임계값은 이 저장소 규약(공개 API 에만)과 맞지 않습니다.
    # 따옴표가 필요합니다 — YAML 이 맨몸 off 를 불리언 false 로 읽습니다.
    docstrings:
      mode: "off"

knowledge_base:
  # 이 저장소의 규범 문서를 리뷰 기준으로 씁니다. AGENTS.md 가 단일 규범이고
  # 스킬에 절차가 있습니다 — 코딩 에이전트가 읽는 것과 같은 것을 읽게 합니다.
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - ".claude/skills/**/SKILL.md"
      - ".cursor/rules/*.mdc"
